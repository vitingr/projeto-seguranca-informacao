version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels: [dependencies, npm]
    commit-message:
      prefix: chore(frontend)
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels: [dependencies, gomod]
    commit-message:
      prefix: build(backend)
    groups:
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]
      gomod-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: build(docker)
    ignore:
      # Go version is aligned by hand with go.mod and the workflows.
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels: [dependencies, docker-compose]
    commit-message:
      prefix: build(docker)
    ignore:
      # A PostgreSQL major needs a dump and restore.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: backend_si
    groups:
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-compose-version:
        applies-to: version-updates
        patterns: ["*"]
