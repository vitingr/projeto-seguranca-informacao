name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mantenha alinhado ao go.mod e ao Dockerfile (ver README, "Versão do Go").
  GO_VERSION: "1.27.x"
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0
  # Node.js runs the Bruno and Redocly CLIs through npx (versions pinned in
  # backend/magefiles).
  NODE_VERSION: "24"

# The backend lives in backend/ inside the repository; every run step uses it
# as the working directory.
defaults:
  run:
    working-directory: backend

# Actions fixadas por SHA de commit (proteção da cadeia de suprimentos).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verificar módulos
        run: go mod verify
      - name: Testes (race + cobertura)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Resumo de cobertura
        run: go tool cover -func=coverage.out
      - name: Magefile tests
        run: go test -race -tags mage ./magefiles

  # The contract is valid OpenAPI 3.1 and the generated Bruno folders match it.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint the contract
        run: go tool mage contractLint
      - name: Check that the Bruno collection matches the contract
        run: |
          go tool mage bruno
          # --porcelain also lists new untracked files, which git diff misses.
          if [ -n "$(git status --porcelain -- bruno/)" ]; then
            echo "::error::bruno/ does not match api/openapi.json: run 'mage bruno' and commit the result"
            git status --porcelain -- bruno/
            git diff -- bruno/
            exit 1
          fi

  # Runs the Bruno assertions against the full stack (app + PostgreSQL).
  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Create .env with generated database and seed passwords
        run: |
          password="$(openssl rand -hex 24)"
          seed_password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "::add-mask::${seed_password}"
          sed -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=${password}/" \
            -e "s/^SEED_ADMIN_PASSWORD=$/SEED_ADMIN_PASSWORD=${seed_password}/" \
            .env.example > .env
      - name: Generate the TLS certificate
        run: go tool mage cert
      - name: Start the stack
        run: go tool mage dockerUp
      - name: Apply the migrations
        run: go tool mage migrateUp
      - name: Run the integration tests against PostgreSQL
        run: go tool mage testIntegration
      - name: Create the seed administrator
        run: go tool mage seed
      - name: Run the Bruno collection
        run: go tool mage brunoRun
      - name: Upload the Bruno report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bruno-report
          path: backend/bruno-report.xml
          if-no-files-found: ignore
      - name: Show the container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: go tool mage dockerDown

  build:
    runs-on: ubuntu-latest
    needs: [lint, vuln, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build do binário estático
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/backend_si ./cmd/server
      - name: Build da imagem Docker
        run: docker build --tag backend_si:ci .
