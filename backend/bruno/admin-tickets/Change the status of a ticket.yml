  - name: 404 Response
    description: The ticket does not exist, the id is malformed, or (for a `comum` user) the ticket is someone else's. Every case gets the same answer.
    request:
      url: "{{baseUrl}}/api/administradores/tickets/:id/status"
      method: PATCH
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      params:
        - name: id
          value: "1"
          type: path
          description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
      body:
        type: json
        data: |-
          {
            "de": "aberto",
