docs: |-
  Moves a ticket from `de`, the status the administrator saw, to `para`, along the allowed transitions (`x-allowed-transitions` of `ChangeStatusRequest`): `aberto` → `em_andamento` or `fechado`; `em_andamento` → `resolvido` or `fechado`; `resolvido` → `em_andamento` or `fechado`. `fechado` is final. The change is recorded in the thread (who, when, from, to) and moves `updated_at`. Administrators only: the author gets 403, also on their own ticket.

  **400** (`bad_request`): the body is not well-formed: `de` or `para` missing, `null` or not a string, or any other key (`actor`, `updated_at`, `id`, ...).

  **409** (`conflict`): the ticket's status is not `de` any more (someone changed it after the page was loaded), or `de` is `fechado`. Nothing changes.

  **422** (`unprocessable_entity`): `de` or `para` is not a status code, or the pair is never allowed (also `de` = `para`).

  **429** (`too_many_requests`): 30 status requests in 60 seconds by the same administrator, valid or not; replies have a quota of their own.
