info:
  name: Change the status of a ticket
  type: http
  seq: 6
  tags:
    - admin-tickets

http:
  method: PATCH
  url: "{{baseUrl}}/api/administradores/tickets/:id/status"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      description: CSRF token returned by `GET /api/csrf`.
  params:
    - name: id
      value: "1"
      type: path
      description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
  body:
    type: json
    data: |-
      {
        "de": "aberto",
        "para": "em_andamento"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: The new status and last update.
    request:
      url: "{{baseUrl}}/api/administradores/tickets/:id/status"
      method: PATCH
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      params:
        - name: id
          value: "1"
          type: path
          description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
      body:
        type: json
        data: |-
          {
            "de": "aberto",
            "para": "em_andamento"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 42,
            "status": "em_andamento",
            "updated_at": "2026-11-26T09:40:00.123456Z"
          }
  - name: 400 Response
    description: The body is not valid JSON, is empty, has unknown fields or data after the first JSON value, is larger than 64 KiB, or the `Content-Type` is not `application/json` (with no charset or `charset=utf-8`).
    request:
      url: "{{baseUrl}}/api/administradores/tickets/:id/status"
      method: PATCH
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      params:
        - name: id
          value: "1"
          type: path
          description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
