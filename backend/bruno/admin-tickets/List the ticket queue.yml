info:
  name: List the ticket queue
  type: http
  seq: 1
  tags:
    - admin-tickets

http:
  method: GET
  url: "{{baseUrl}}/api/administradores/tickets"
  params:
    - name: status
      value: aberto
      type: query
      description: "Only tickets in this status. Absent: every status."
      disabled: true
    - name: status
      value: em_andamento
      type: query
      description: "Only tickets in this status. Absent: every status."
      disabled: true
    - name: status
      value: resolvido
      type: query
      description: "Only tickets in this status. Absent: every status."
      disabled: true
    - name: status
      value: fechado
      type: query
      description: "Only tickets in this status. Absent: every status."
      disabled: true
    - name: tipo
      value: acesso
      type: query
      description: "Only tickets of this type. Absent: every type."
      disabled: true
    - name: tipo
      value: bug
      type: query
      description: "Only tickets of this type. Absent: every type."
      disabled: true
    - name: tipo
      value: deploy
      type: query
      description: "Only tickets of this type. Absent: every type."
      disabled: true
    - name: tipo
      value: outro
      type: query
      description: "Only tickets of this type. Absent: every type."
      disabled: true
    - name: usuario
      value: ""
      type: query
      description: "Only tickets of the user with this login (the login rule: `^[a-z0-9._-]{3,64}$`). Absent: every user. Queue only."
      disabled: true
    - name: pagina
      value: "1"
      type: query
      description: "Page number, from 1. Digits only, no sign and no leading zero. Absent: 1."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

