info:
  name: List audit events
  type: http
  seq: 1
  tags:
    - audit

http:
  method: GET
  url: "{{baseUrl}}/api/audit-events"
  params:
    - name: type
      value: login_succeeded
      type: query
      description: Only the events of this type. Empty or absent lists every event.
      disabled: true
    - name: type
      value: login_failed
      type: query
      description: Only the events of this type. Empty or absent lists every event.
      disabled: true
    - name: type
      value: logout
      type: query
      description: Only the events of this type. Empty or absent lists every event.
      disabled: true
    - name: type
      value: user_created
      type: query
      description: Only the events of this type. Empty or absent lists every event.
      disabled: true
    - name: type
      value: post_removed
      type: query
      description: Only the events of this type. Empty or absent lists every event.
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Page of the list, starting at 1.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

