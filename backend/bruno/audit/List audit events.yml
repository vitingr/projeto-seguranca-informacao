docs: |-
  One page of the audit log, newest first (`created_at`, then `id`, descending), 20 events per page, optionally only the events of one `type`. The log is append-only: there is no operation to change or delete an event.

  An event never holds free text: no login typed in a failed login, no password, token or cookie. `actor` is the user who acted (`null` for a failed login); `target` is what the event is about (`null` for a login, a logout, or a failed login with an unknown login). The logins are read from the users when the log is listed and are left out when the user no longer exists.

  `ip` is the address of the direct TCP peer of the request (`null` if it did not parse). Forwarding headers such as `X-Forwarded-For` are ignored, so events sent through the frontend server record that server's address.

  **400** (`bad_request`): `type` is not one of the events, or `page` is not an integer from 1 to 10000.
