info:
  name: Log in
  type: http
  seq: 2
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      description: CSRF token returned by `GET /api/csrf`.
  body:
    type: json
    data: |-
      {
        "login": "admin",
        "senha": "correct-horse-battery-staple"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Logged in. A new session cookie is set.
    request:
      url: "{{baseUrl}}/api/login"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "login": "admin",
            "senha": "correct-horse-battery-staple"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user_id": 1,
            "login": "admin",
            "role": "admin"
          }
  - name: 400 Response
    description: The body is not valid JSON, is empty, has unknown fields or data after the first JSON value, is larger than 64 KiB, or the `Content-Type` is not `application/json` (with no charset or `charset=utf-8`).
    request:
      url: "{{baseUrl}}/api/login"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "login": "admin",
            "senha": "correct-horse-battery-staple"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "bad_request",
            "message": "A requisição não pôde ser processada.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 401 Response
    description: Not authenticated (no session, or the session expired), or invalid credentials on login.
    request:
      url: "{{baseUrl}}/api/login"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "login": "admin",
            "senha": "correct-horse-battery-staple"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Autenticação necessária.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 403 Response
    description: Missing or invalid CSRF token, a cross-origin browser request (Fetch Metadata), or a role that the operation does not allow.
    request:
      url: "{{baseUrl}}/api/login"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "login": "admin",
            "senha": "correct-horse-battery-staple"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "forbidden",
            "message": "Você não tem permissão para acessar este recurso.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 500 Response
    description: Unexpected error. Details go to the log, never to the client.
    request:
      url: "{{baseUrl}}/api/login"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "login": "admin",
            "senha": "correct-horse-battery-staple"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "internal",
            "message": "Ocorreu um erro inesperado. Tente novamente mais tarde.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }

docs: Checks the credentials and starts a new authenticated session. Unknown users and wrong passwords get the same 401 response.
