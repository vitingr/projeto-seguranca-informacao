info:
  name: List posts
  type: http
  seq: 1
  tags:
    - posts

http:
  method: GET
  url: "{{baseUrl}}/api/posts"
  params:
    - name: page
      value: "1"
      type: query
      description: Page of the wall, starting at 1.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: One page of posts, possibly empty.
    request:
      url: "{{baseUrl}}/api/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Page of the wall, starting at 1.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": 1,
                "title": "Bem-vindos ao mural",
                "body": "Primeiro post.\nSegunda linha.",
                "author": {
                  "user_id": 2,
                  "login": "maria.silva"
                },
                "created_at": "2026-11-22T12:00:00Z",
                "updated_at": "2026-11-22T12:00:00Z",
                "mine": true
              }
            ],
            "page": 1,
            "page_size": 20,
            "has_next": false
          }
  - name: 400 Response
    description: The body is not valid JSON, is empty, has unknown fields or data after the first JSON value, is larger than 64 KiB, or the `Content-Type` is not `application/json` (with no charset or `charset=utf-8`).
    request:
      url: "{{baseUrl}}/api/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Page of the wall, starting at 1.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "bad_request",
            "message": "A requisição não pôde ser processada.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 401 Response
    description: Not authenticated (no session, or the session expired), or invalid credentials on login.
    request:
      url: "{{baseUrl}}/api/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Page of the wall, starting at 1.
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Autenticação necessária.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 403 Response
    description: Missing or invalid CSRF token, a cross-origin browser request (Fetch Metadata), or a role that the operation does not allow.
    request:
      url: "{{baseUrl}}/api/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Page of the wall, starting at 1.
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "forbidden",
            "message": "Você não tem permissão para acessar este recurso.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 500 Response
    description: Unexpected error. Details go to the log, never to the client.
    request:
      url: "{{baseUrl}}/api/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Page of the wall, starting at 1.
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "internal",
            "message": "Ocorreu um erro inesperado. Tente novamente mais tarde.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }

docs: |-
  One page of the wall with the posts of every user, newest first (`created_at`, then `id`, descending), 20 posts per page. `has_next` tells whether a next page exists, and `mine` is true on the caller's own posts.

  **400** (`bad_request`): `page` is not an integer from 1 to 10000.
