docs: |-
  Removes any post from the wall, with a reason. The post is kept (soft delete) and frozen: its author can no longer edit or delete it, and it cannot be removed again. Other comum users no longer see it; its author and the administrators see it with `removal`. The removal and its `post_removed` audit event are written in one transaction.

  **400** (`bad_request`): the body is not well-formed for this operation: malformed JSON, a `Content-Type` other than `application/json`, an unknown field, or a field of the wrong JSON type.

  **422** (`unprocessable_entity`): the body is well-formed but `reason` is missing, empty after trimming, too long, or has a control character that is not allowed (see `RemovalRequest`).

  **404** (`not_found`): no post with this `id` is on the wall: it does not exist, it was already removed, or `id` is not a positive integer.
