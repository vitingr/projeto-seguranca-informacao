info:
  name: Remove post
  type: http
  seq: 5
  tags:
    - posts

http:
  method: POST
  url: "{{baseUrl}}/api/posts/:id/removal"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      description: CSRF token returned by `GET /api/csrf`.
  params:
    - name: id
      value: "1"
      type: path
      description: ID of the post.
  body:
    type: json
    data: |-
      {
        "reason": "Conteúdo ofensivo."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
