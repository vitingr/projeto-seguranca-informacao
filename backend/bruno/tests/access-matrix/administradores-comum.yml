info:
  name: administradores-comum
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/api/administradores"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // The fresh CSRF token is sent on POSTs, so a 403 comes from Authorize
        // (the Go test TestAccessMatrix checks the log reason).
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
