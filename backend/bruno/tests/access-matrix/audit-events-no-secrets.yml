info:
  name: audit-events-no-secrets
  type: http
  seq: 61

http:
  method: GET
  url: "{{baseUrl}}/api/audit-events"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // No event holds a password or a token (006 S-2). The failed logins of
        // tests/ typed the seed login with a wrong password.
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("no event holds a secret", function () {
          const text = JSON.stringify(res.getBody());
          const secrets = [
            bru.interpolate("{{process.env.SEED_ADMIN_PASSWORD}}"),
            bru.interpolate("{{process.env.BRUNO_COMUM_PASSWORD}}"),
            "definitely-not-the-seed-password",
            bru.getVar("csrfToken"),
          ];
          secrets.forEach((s) => expect(text).to.not.include(s));
          expect(text).to.not.include("senha");
        });
