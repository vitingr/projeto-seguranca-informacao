info:
  name: cadastro-anonymous
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/cadastro"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.BRUNO_COMUM_LOGIN}}.anon",
        "senha": "{{process.env.BRUNO_COMUM_PASSWORD}}",
        "papel": "comum"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Anonymous with a valid CSRF token: the CSRF check passes and
        // Authorize answers 401.
        test("status is 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("error is unauthorized", function () {
          expect(res.getBody().error).to.equal("unauthorized");
        });
