info:
  name: cadastro-comum-user
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/cadastro"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.BRUNO_COMUM_LOGIN}}",
        "senha": "{{process.env.BRUNO_COMUM_PASSWORD}}",
        "papel": "comum"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Registers the comum user of this run (generated by "mage brunoRun").
        test("status is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("returns the new user", function () {
          const body = res.getBody();
          expect(body.user_id).to.be.a("number").and.above(0);
          expect(body.user_id).to.not.equal(bru.getVar("adminUserId"));
          expect(body.login).to.equal(bru.interpolate("{{process.env.BRUNO_COMUM_LOGIN}}"));
          expect(body.role).to.equal("comum");
          expect(Object.keys(body).sort()).to.deep.equal(["login", "role", "user_id"]);
          bru.setVar("comumUserId", body.user_id);
        });
