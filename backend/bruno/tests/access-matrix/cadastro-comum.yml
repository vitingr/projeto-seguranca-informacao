info:
  name: cadastro-comum
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/cadastro"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.BRUNO_COMUM_LOGIN}}.comum",
        "senha": "{{process.env.BRUNO_COMUM_PASSWORD}}",
        "papel": "comum"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
