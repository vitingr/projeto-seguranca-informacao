# Hand-written. Run by "mage brunoRun" after the root requests of tests/
# (bru run tests tests/access-matrix tests/tickets, 003 D-15).
#
# The 18-cell access matrix (003 D-2, plus POST /api/tickets from spec
# 001-ticket-builder), one caller at a time, with the shared cookie jar:
# anonymous (2-7) -> seed admin (10-12, 15-17) -> the comum user that the
# admin registers in 12 (21-26). Requests 13 and 14 check the 409 and 422 of
# POST /api/cadastro.
#
# The comum credentials come from BRUNO_COMUM_LOGIN and BRUNO_COMUM_PASSWORD,
# which "mage brunoRun" generates with crypto/rand for every run (003 D-13),
# so each run leaves one e2e.* user: see the README to delete them. Every POST
# sends the current CSRF token, so a 401 or 403 comes from Authorize.
info:
  name: access-matrix
  type: folder

request:
  auth: inherit
