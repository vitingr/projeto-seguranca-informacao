info:
  name: login-admin-moderation
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.SEED_ADMIN_LOGIN}}",
        "senha": "{{process.env.SEED_ADMIN_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the seed admin", function () {
          expect(res.getBody().user_id).to.equal(bru.getVar("adminUserId"));
        });
