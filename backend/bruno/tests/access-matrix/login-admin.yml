info:
  name: login-admin
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.SEED_ADMIN_LOGIN}}",
        "senha": "{{process.env.SEED_ADMIN_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the seed admin", function () {
          const body = res.getBody();
          expect(body.user_id).to.be.a("number").and.above(0);
          expect(body.role).to.equal("admin");
          bru.setVar("adminUserId", body.user_id);
        });
