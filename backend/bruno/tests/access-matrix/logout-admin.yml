info:
  name: logout-admin
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/logout"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 204", function () {
          expect(res.getStatus()).to.equal(204);
        });
        test("expires the session cookie", function () {
          const cookies = [].concat(res.getHeader("set-cookie") || []);
          const session = cookies.find((c) => c.startsWith("__Host-session="));
          expect(session, "Set-Cookie: __Host-session").to.be.a("string");
          expect(session).to.include("Max-Age=0");
        });
