info:
  name: matrix-ticket-comum
  type: http
  seq: 202

http:
  method: GET
  url: "{{baseUrl}}/api/tickets"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const items = (res.getBody() || {}).items || [];
        bru.setVar("matrixTicketId", items.length > 0 ? items[0].id : 0);
    - type: tests
      code: |-
        test("the comum user has the ticket of request 25", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().items.length).to.equal(1);
          expect(bru.getVar("matrixTicketId")).to.be.a("number").and.above(0);
        });
