info:
  name: posts-delete-without-csrf
  type: http
  seq: 38

http:
  method: DELETE
  url: "{{baseUrl}}/api/posts/{{postId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // No X-CSRF-Token header: the CSRF middleware answers 403 and
        // nothing is written (posts-list-comum checks it, 005 S-4).
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
