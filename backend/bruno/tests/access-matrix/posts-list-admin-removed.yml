info:
  name: posts-list-admin-removed
  type: http
  seq: 59

http:
  method: GET
  url: "{{baseUrl}}/api/posts"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Admins see every post, the removed ones marked with the reason (006 D-1).
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("shows the removed post with its reason", function () {
          const items = res.getBody().items;
          const post = items.find((p) => p.id === bru.getVar("removalPostId"));
          expect(post, "the removed post").to.be.an("object");
          expect(post.mine).to.equal(false);
          expect(post.removal.reason).to.equal("Removido pelo Bruno.\nSegunda linha.");
          expect(post.removal.removed_at).to.be.a("string");
          items.forEach((p) => expect(p.mine).to.equal(false));
        });
