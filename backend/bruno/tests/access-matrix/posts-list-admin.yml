info:
  name: posts-list-admin
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/posts"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Admins read the wall to moderate it (006 D-1; it was 403 in 005).
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns a page where nothing is the admin's", function () {
          const body = res.getBody();
          expect(body.page).to.equal(1);
          expect(body.items).to.be.an("array");
          body.items.forEach((p) => expect(p.mine).to.equal(false));
        });
