info:
  name: posts-remove-comum
  type: http
  seq: 48

http:
  method: POST
  url: "{{baseUrl}}/api/posts/{{removalPostId}}/removal"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "reason": "Tentativa do comum."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Only administrators remove posts (006 S-3).
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
