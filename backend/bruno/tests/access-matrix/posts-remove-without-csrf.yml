info:
  name: posts-remove-without-csrf
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseUrl}}/api/posts/{{removalPostId}}/removal"
  body:
    type: json
    data: |-
      {
        "reason": "Sem token."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // No X-CSRF-Token header: the CSRF middleware answers 403 and the post
        // stays on the wall (posts-remove-admin removes it next).
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
