    - type: tests
      code: |-
        // A body that is blank after trimming (005 D-4).
        test("status is 422", function () {
          expect(res.getStatus()).to.equal(422);
        });
        test("error is unprocessable_entity", function () {
          expect(res.getBody().error).to.equal("unprocessable_entity");
        });
