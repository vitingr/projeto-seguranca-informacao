info:
  name: queue-authors-admin
  type: http
  seq: 316

http:
  method: GET
  url: "{{baseUrl}}/api/administradores/tickets/autores"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("lists the authors", function () {
          const logins = res.getBody().logins;
          expect(Object.keys(res.getBody())).to.deep.equal(["logins"]);
          expect(logins).to.include(bru.interpolate("{{process.env.BRUNO_COMUM_LOGIN}}"));
          expect(logins.length).to.be.at.most(500);
          expect(new Set(logins).size).to.equal(logins.length);
        });
