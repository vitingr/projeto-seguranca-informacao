info:
  name: reply-admin
  type: http
  seq: 314

http:
  method: POST
  url: "{{baseUrl}}/api/tickets/{{matrixTicketId}}/mensagens"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "texto": "Resposta pela rota errada."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Spec 003 P-2: admins reply on /api/administradores/tickets/{id}.
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
