info:
  name: reply-anonymous
  type: http
  seq: 104

http:
  method: POST
  url: "{{baseUrl}}/api/tickets/1/mensagens"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "texto": "Alguma novidade?"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("error is unauthorized", function () {
          expect(res.getBody().error).to.equal("unauthorized");
        });
