info:
  name: status-comum
  type: http
  seq: 220

http:
  method: PATCH
  url: "{{baseUrl}}/api/administradores/tickets/{{matrixTicketId}}/status"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "de": "aberto",
        "para": "fechado"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
          expect(res.getBody().error).to.equal("forbidden");
        });
