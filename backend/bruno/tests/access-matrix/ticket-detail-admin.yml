info:
  name: ticket-detail-admin
  type: http
  seq: 312

http:
  method: GET
  url: "{{baseUrl}}/api/tickets/{{matrixTicketId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Spec 003 P-2: the comum route refuses admins by role, before any
        // ticket is read; they use /api/administradores/tickets/{id}.
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
