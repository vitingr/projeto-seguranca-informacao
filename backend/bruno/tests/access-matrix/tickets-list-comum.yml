info:
  name: tickets-list-comum
  type: http
  seq: 211

http:
  method: GET
  url: "{{baseUrl}}/api/tickets"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("is a page of summaries", function () {
          const body = res.getBody();
          expect(Object.keys(body).sort()).to.deep.equal(["items", "page", "page_size", "pages", "total"]);
          expect(body.page_size).to.equal(20);
          expect(body.items.length).to.be.at.least(1);
          for (const item of body.items) {
            expect(Object.keys(item).sort()).to.deep.equal(["created_at", "id", "status", "title", "type", "updated_at"]);
          }
        });
        test("Cache-Control is no-store", function () {
          expect(res.getHeader("cache-control")).to.equal("no-store");
        });
