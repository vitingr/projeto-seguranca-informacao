info:
  name: tracking-csrf-anonymous
  type: http
  seq: 100

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        // Spec 003: a new anonymous session for the ticket tracking cells
        // (100-199); the comum user logged out in 26.
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns a CSRF token", function () {
          expect(res.getBody().csrf_token).to.match(/^[A-Z2-7]{26}$/);
        });
