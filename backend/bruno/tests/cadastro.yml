info:
  name: cadastro
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/cadastro"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "maria.silva",
        "senha": "another-long-passphrase",
        "papel": "comum"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
