info:
  name: csrf
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The POSTs below send this token in X-CSRF-Token.
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("names the CSRF header", function () {
          expect(res.getBody().header).to.equal("X-CSRF-Token");
        });
        test("returns a CSRF token", function () {
          expect(res.getBody().csrf_token).to.match(/^[A-Z2-7]{26}$/);
        });
        test("creates an anonymous session cookie", function () {
          const cookies = [].concat(res.getHeader("set-cookie") || []);
          const session = cookies.find((c) => c.startsWith("__Host-session="));
          expect(session, "Set-Cookie: __Host-session").to.be.a("string");
          expect(session).to.include("HttpOnly");
          expect(session).to.include("Secure");
          expect(session).to.include("SameSite=Lax");
          expect(session).to.include("Path=/");
          expect(session).to.not.match(/Max-Age|Expires/i);
        });
