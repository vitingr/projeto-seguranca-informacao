# Hand-written. Run by "mage brunoRun".
#
# The requests run in "seq" order and share the cookie jar:
# csrf (anonymous session) -> anonymous checks (401) -> rejected logins
# (403, 400, 401) -> login as the seed admin -> csrf again (new token) ->
# me -> logout -> the old cookie gets 401.
#
# The login reads SEED_ADMIN_LOGIN and SEED_ADMIN_PASSWORD with
# {{process.env.NAME}}; "mage brunoRun" passes them from .env, so run
# "mage seed" first. The role matrix is added in 003.
info:
  name: tests
  type: folder

request:
  auth: inherit
