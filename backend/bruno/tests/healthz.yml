info:
  name: healthz
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/healthz"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("status is ok", function () {
          expect(res.getBody().status).to.equal("ok");
        });
        test("does not set a session cookie", function () {
          const cookies = [].concat(res.getHeader("set-cookie") || []);
          expect(cookies.some((c) => c.startsWith("__Host-session="))).to.equal(false);
        });
