info:
  name: login-wrong-password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.SEED_ADMIN_LOGIN}}",
        "senha": "definitely-not-the-seed-password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // The seed admin exists; the password is wrong. The answer is the
        // generic 401, the same as for an unknown user.
        test("status is 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("error is unauthorized", function () {
          expect(res.getBody().error).to.equal("unauthorized");
        });
        test("message is generic", function () {
          const message = res.getBody().message;
          expect(message).to.be.a("string").and.not.be.empty;
          expect(message).to.not.include(bru.interpolate("{{process.env.SEED_ADMIN_LOGIN}}"));
        });
        test("does not start a session", function () {
          const cookies = [].concat(res.getHeader("set-cookie") || []);
          expect(cookies.some((c) => c.startsWith("__Host-session="))).to.equal(false);
        });
