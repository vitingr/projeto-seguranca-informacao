info:
  name: login
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.SEED_ADMIN_LOGIN}}",
        "senha": "{{process.env.SEED_ADMIN_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the seed admin", function () {
          const body = res.getBody();
          expect(body.user_id).to.be.a("number").and.above(0);
          expect(body.login).to.equal(bru.interpolate("{{process.env.SEED_ADMIN_LOGIN}}").toLowerCase());
          expect(body.role).to.equal("admin");
        });
        test("sets a new session cookie", function () {
          const cookies = [].concat(res.getHeader("set-cookie") || []);
          const session = cookies.find((c) => c.startsWith("__Host-session="));
          expect(session, "Set-Cookie: __Host-session").to.be.a("string");
          expect(session).to.include("HttpOnly");
          expect(session).to.include("Secure");
          expect(session).to.include("SameSite=Lax");
          expect(session).to.include("Path=/");
          const pair = session.split(";")[0];
          expect(pair).to.not.equal(bru.getVar("anonCookie"));
          // Saved for me-after-logout (D-17).
          bru.setVar("sessionCookie", pair);
        });
