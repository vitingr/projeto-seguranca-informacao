info:
  name: logout
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/logout"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function () {
          expect(res.getStatus()).to.equal(403);
        });
        test("error is forbidden", function () {
          expect(res.getBody().error).to.equal("forbidden");
        });
