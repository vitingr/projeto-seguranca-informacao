info:
  name: me-after-logout
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Cookie
      value: "{{sessionCookie}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("error is unauthorized", function () {
          expect(res.getBody().error).to.equal("unauthorized");
        });
