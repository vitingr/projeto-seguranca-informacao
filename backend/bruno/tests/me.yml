info:
  name: me
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the caller", function () {
          const body = res.getBody();
          expect(body.user_id).to.be.a("number").and.above(0);
          expect(body.role).to.equal("admin");
        });
