info:
  name: old-page-path-cadastrar-usuarios
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/cadastrar-usuarios"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // The frontend pages moved to /usuarios, /administradores and
        // /cadastro (spec 001-ticket-builder, AC-0.7). The backend never
        // served page paths: the old ones get the generic 404.
        test("status is 404", function () {
          expect(res.getStatus()).to.equal(404);
        });
        test("body is the generic not_found error", function () {
          const body = res.getBody();
          expect(Object.keys(body).sort()).to.eql(["error", "message", "request_id"]);
          expect(body.error).to.equal("not_found");
          expect(body.message).to.equal("Recurso não encontrado.");
        });
