info:
  name: a-reply-closed-409
  type: http
  seq: 522

http:
  method: POST
  url: "{{baseUrl}}/api/tickets/{{ticketA1}}/mensagens"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "texto": "Ainda preciso de ajuda."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // AC-3.7, BR-5: the author cannot reply on a fechado ticket.
        test("status is 409", function () {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().message).to.equal("Este ticket foi fechado e não aceita novas mensagens.");
        });
