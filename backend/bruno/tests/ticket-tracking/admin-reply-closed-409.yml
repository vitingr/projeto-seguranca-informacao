  type: http
  seq: 256

http:
  method: POST
  url: "{{baseUrl}}/api/administradores/tickets/{{ticketA1}}/mensagens"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "texto": "Mais uma mensagem"
      }
  auth: inherit

runtime:
