info:
  name: admin-thread
  type: http
  seq: 230

http:
  method: GET
  url: "{{baseUrl}}/api/administradores/tickets/{{ticketA1}}/mensagens"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // AC-5.3, and S-2 from the other side: the thread of A's ticket holds
        // A's reply of 60 only, so B's reply (125) and the refused ones
        // (63-65) stored nothing.
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("holds only A's reply, with A's login", function () {
          const entries = res.getBody().entries;
          expect(entries.map((e) => e.id)).to.deep.equal([bru.getVar("messageA1")]);
          expect(entries[0].actor_login).to.equal(bru.interpolate("{{process.env.BRUNO_COMUM_LOGIN}}.a"));
          expect(entries[0].side).to.equal("author");
        });
