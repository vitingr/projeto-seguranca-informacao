info:
  name: csrf-before-a-return
  type: http
  seq: 500

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        // A comes back after the support team worked the tickets (500-590).
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
