info:
  name: csrf-before-admin-login
  type: http
  seq: 200

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
