info:
  name: csrf
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        // tests/tickets ended with a logout: a new anonymous session.
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
