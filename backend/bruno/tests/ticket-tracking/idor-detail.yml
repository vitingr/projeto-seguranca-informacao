info:
  name: idor-detail
  type: http
  seq: 120

http:
  method: GET
  url: "{{baseUrl}}/api/tickets/{{ticketA1}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Kept to compare with a ticket that does not exist (121, 122).
        const body = Object.assign({}, res.getBody());
        delete body.request_id;
        bru.setVar("idorAnswer", JSON.stringify({ status: res.getStatus(), body: body }));
    - type: tests
      code: |-
        // Spec 003 S-2: B asks for A's ticket and gets the generic 404.
        test("status is 404", function () {
          expect(res.getStatus()).to.equal(404);
        });
        test("generic not_found body", function () {
          const body = res.getBody();
          expect(Object.keys(body).sort()).to.deep.equal(["error", "message", "request_id"]);
          expect(body.error).to.equal("not_found");
          expect(body.message).to.equal("Recurso não encontrado.");
        });
