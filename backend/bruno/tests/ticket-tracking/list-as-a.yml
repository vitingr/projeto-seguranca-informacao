info:
  name: list-as-a
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/api/tickets"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("holds exactly A's tickets, newest first", function () {
          const body = res.getBody();
          expect(body.items.map((t) => t.id)).to.deep.equal([bru.getVar("ticketA2"), bru.getVar("ticketA1")]);
          expect(body.total).to.equal(2);
          expect(body.page).to.equal(1);
          expect(body.pages).to.equal(1);
          expect(body.page_size).to.equal(20);
        });
        test("items are summaries", function () {
          const [outro, bug] = res.getBody().items;
          expect(Object.keys(bug).sort()).to.deep.equal(["created_at", "id", "status", "title", "type", "updated_at"]);
          expect(bug.type).to.equal("bug");
          expect(bug.title).to.equal("Bug em Portal");
          expect(bug.status).to.equal("aberto");
          expect(outro.title).to.equal("Dúvida sobre a VPN");
        });
