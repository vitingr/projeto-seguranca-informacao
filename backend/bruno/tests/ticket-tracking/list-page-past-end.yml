info:
  name: list-page-past-end
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/api/tickets?pagina=5"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Plan P-9: a page past the end is 200 with no items and the real
        // totals.
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("has no items and the real totals", function () {
          const body = res.getBody();
          expect(body.items).to.deep.equal([]);
          expect(body.total).to.equal(2);
          expect(body.page).to.equal(5);
          expect(body.pages).to.equal(1);
        });
