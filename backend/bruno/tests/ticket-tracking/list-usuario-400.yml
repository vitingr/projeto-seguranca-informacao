info:
  name: list-usuario-400
  type: http
  seq: 33

http:
  method: GET
  url: "{{baseUrl}}/api/tickets?usuario={{process.env.BRUNO_COMUM_LOGIN}}.b"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // S-3: a comum user cannot pick the author; the parameter is
        // refused, never honored.
        test("status is 400", function () {
          expect(res.getStatus()).to.equal(400);
        });
        test("generic body", function () {
          const body = res.getBody();
          expect(Object.keys(body).sort()).to.deep.equal(["error", "message", "request_id"]);
          expect(body.error).to.equal("bad_request");
        });
