info:
  name: login-b
  type: http
  seq: 101

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.BRUNO_COMUM_LOGIN}}.b",
        "senha": "{{process.env.BRUNO_COMUM_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().user_id).to.equal(bru.getVar("userBId"));
        });
