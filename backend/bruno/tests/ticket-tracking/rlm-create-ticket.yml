info:
  name: rlm-create-ticket
  type: http
  seq: 403

http:
  method: POST
  url: "{{baseUrl}}/api/tickets"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "tipo": "outro",
        "dados": {
          "titulo": "Teste do limite de respostas",
          "descricao": "Ticket que recebe as 30 respostas."
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.equal(201);
          bru.setVar("ticketRlm", res.getBody().id);
        });
