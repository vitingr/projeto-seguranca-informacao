info:
  name: thread-as-a
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/api/tickets/{{ticketA1}}/mensagens"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Spec 003 AC-3.3: a new ticket has no entry yet (the opening line
        // comes from created_at, it is not stored).
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("is empty", function () {
          expect(res.getBody()).to.deep.equal({ entries: [], has_more: false });
        });
