info:
  name: csrf-before-admin-login
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/csrf"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The rate limit test needs its own user, so its quota is not shared
        // with the requests above. The seed admin registers it.
        bru.setVar("csrfToken", res.getBody().csrf_token);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
