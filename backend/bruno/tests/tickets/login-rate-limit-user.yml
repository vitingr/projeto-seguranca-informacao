info:
  name: login-rate-limit-user
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "login": "{{process.env.BRUNO_COMUM_LOGIN}}.rl",
        "senha": "{{process.env.BRUNO_COMUM_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // bru.sendRequest does not use the cookie jar.
        const cookies = [].concat(res.getHeader("set-cookie") || []);
        const session = cookies.find((c) => c.startsWith("__Host-session="));
        bru.setVar("rateLimitCookie", session ? session.split(";")[0] : "");
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().role).to.equal("comum");
        });
