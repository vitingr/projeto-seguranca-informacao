info:
  name: tickets-acesso
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/tickets"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "tipo": "acesso",
        "dados": {
          "sistema": "Grafana",
          "nivel_acesso": "escrita",
          "justificativa": "Preciso editar os painéis da equipe."
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("returns the ticket with the server title", function () {
          const body = res.getBody();
          expect(body.type).to.equal("acesso");
          expect(body.title).to.equal("Acesso a Grafana");
          expect(body.status).to.equal("aberto");
          expect(body.created_at).to.equal(body.updated_at);
        });
