info:
  name: Create ticket
  type: http
  seq: 1
  tags:
    - tickets

http:
  method: POST
  url: "{{baseUrl}}/api/tickets"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      description: CSRF token returned by `GET /api/csrf`.
  body:
    type: json
    data: |-
      {
        "tipo": "acesso",
        "dados": {
          "sistema": "Grafana",
          "nivel_acesso": "leitura",
          "justificativa": "Preciso ver os painéis de monitoramento da equipe."
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Ticket created with status `aberto`.
    request:
      url: "{{baseUrl}}/api/tickets"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "tipo": "acesso",
            "dados": {
              "sistema": "Grafana",
              "nivel_acesso": "leitura",
              "justificativa": "Preciso ver os painéis de monitoramento da equipe."
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "type": "acesso",
            "title": "Acesso a Grafana",
            "status": "aberto",
            "created_at": "2026-11-25T14:30:00.123456Z",
            "updated_at": "2026-11-25T14:30:00.123456Z"
          }
  - name: 400 Response
    description: The body is not valid JSON, is empty, has unknown fields or data after the first JSON value, is larger than 64 KiB, or the `Content-Type` is not `application/json` (with no charset or `charset=utf-8`).
    request:
      url: "{{baseUrl}}/api/tickets"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "tipo": "acesso",
            "dados": {
              "sistema": "Grafana",
              "nivel_acesso": "leitura",
              "justificativa": "Preciso ver os painéis de monitoramento da equipe."
            }
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "bad_request",
            "message": "A requisição não pôde ser processada.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 401 Response
    description: Not authenticated (no session, or the session expired), or invalid credentials on login.
    request:
      url: "{{baseUrl}}/api/tickets"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      body:
        type: json
        data: |-
          {
            "tipo": "acesso",
            "dados": {
              "sistema": "Grafana",
              "nivel_acesso": "leitura",
              "justificativa": "Preciso ver os painéis de monitoramento da equipe."
            }
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Autenticação necessária.",
            "request_id": "0f8e2c4b9a7d4e1f"
          }
  - name: 403 Response
    description: Missing or invalid CSRF token, a cross-origin browser request (Fetch Metadata), or a role that the operation does not allow.
    request:
