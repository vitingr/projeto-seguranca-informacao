info:
  name: Reply on one of my tickets
  type: http
  seq: 5
  tags:
    - tickets

http:
  method: POST
  url: "{{baseUrl}}/api/tickets/:id/mensagens"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
      description: CSRF token returned by `GET /api/csrf`.
  params:
    - name: id
      value: "1"
      type: path
      description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
  body:
    type: json
    data: |-
      {
        "texto": "O erro voltou hoje de manhã.\nSegue o horário: 09:10."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: The stored message, as it appears in the thread.
    request:
      url: "{{baseUrl}}/api/tickets/:id/mensagens"
      method: POST
      headers:
        - name: X-CSRF-Token
          value: "{{csrfToken}}"
          description: CSRF token returned by `GET /api/csrf`.
      params:
        - name: id
