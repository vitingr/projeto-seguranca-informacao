          description: "Ticket number: digits only, no sign and no leading zero, from 1 to 9223372036854775807. Any other value is answered like a ticket that does not exist (404)."
      body:
        type: json
        data: |-
          {
            "texto": "O erro voltou hoje de manhã.\nSegue o horário: 09:10."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 10,
            "kind": "message",
            "side": "author",
            "mine": true,
            "text": "O erro voltou hoje de manhã.\nSegue o horário: 09:10.",
            "created_at": "2026-11-26T09:20:00.123456Z"
          }
